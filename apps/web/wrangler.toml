name = "dog-dash"
main = ".worker-next/index.mjs"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]
assets = { directory = ".worker-next/assets", binding = "ASSETS" }

# Environment variables — set secrets via `wrangler secret put <KEY>`
# or in the Cloudflare dashboard under Workers > dog-dash > Settings > Variables.
# DO NOT add secret values here; use [vars] only for non-sensitive config.
# [vars]
# NEXT_PUBLIC_APP_URL = "https://dog-dash.workers.dev"
